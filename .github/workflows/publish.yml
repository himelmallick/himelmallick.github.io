# Builds the site with Quarto and publishes it to GitHub Pages on every push,
# and once a night so that posts dated in the future appear on their day.
# One-time setup: repository Settings > Pages > Source = "GitHub Actions".
name: Publish site

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "10 5 * * *"   # every night, shortly after midnight in New York
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: python3 assets/schedule-posts.py   # holds back posts dated in the future
      - run: python3 assets/update-stats.py     # refreshes the download counts on the Software page
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
