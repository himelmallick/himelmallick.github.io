project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "experience/"
    - "awards/"
    - "software/"
    - "papers/"
    - "talks/"
    - "contact/"
    - "post/"
  resources:
    - "post/**/*.R"
    - "post/**/*.docx"
    - "post/**/Rplot.pdf"
    - "assets/fonts/*.woff2"
    - "files/*.pdf"

website:
  title: "Himel Mallick"
  description: "Himel Mallick is a statistical scientist and Principal Investigator at Cornell University, with broad research interests in AI and medicine, working on problems at the intersection of computational biology and machine learning."
  site-url: https://www.himelmallick.org
  favicon: assets/favicon.svg
  # The picture shown when a page without its own image is shared on social media
  image: /assets/share-card.jpg
  image-alt: "Himel Mallick, PhD, FASA. Principal Investigator, Cornell University."
  search: false
  open-graph: true
  twitter-card:
    creator: "@Mallick_Himel"
  navbar:
    title: "Himel Mallick"
    collapse-below: lg
    right:
      - text: About
        href: index.qmd
      - text: Experience
        href: experience/index.qmd
      - text: Papers
        href: papers/index.qmd
      - text: Software
        href: software/index.qmd
      - text: Talks
        href: talks/index.qmd
      - text: Posts
        href: post/index.qmd
      - text: Contact
        href: contact/index.qmd
      - text: Curriculum Vitae
        menu:
          - text: CV
            href: files/CV_Himel_Mallick.pdf
            target: _blank
          - text: Resume
            href: files/Resume_Himel_Mallick.pdf
            target: _blank
  page-footer:
    left: "Himel Mallick, Weill Cornell Medicine, 425 E 61st St, New York, NY 10065"
    right: "[Email](mailto:him4004@med.cornell.edu) [GitHub](https://github.com/himelmallick) [RSS](/post/index.xml)"

format:
  html:
    theme:
      light: [default, assets/theme.scss]
      dark: [default, assets/theme.scss, assets/theme-dark.scss]
    respect-user-color-scheme: true
    css: assets/fonts/fonts.css
    page-layout: full
    toc: false
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: true
    link-external-icon: false
    citations-hover: false
    footnotes-hover: false
    code-copy: true
    highlight-style:
      light: github
      dark: github-dark
    date-format: "MMM D, YYYY"
    lang: en
